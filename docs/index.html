<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tihulu Star Trail Web</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Tihulu Web</p>
          <h1>Star Trail Forge</h1>
        </div>
        <div class="status-chip" id="statusChip">BROWSER</div>
      </header>

      <section class="workspace" aria-label="Tihulu web app">
        <section class="control-panel">
          <label class="drop-zone" id="dropZone">
            <input id="fileInput" type="file" accept="image/*" multiple>
            <span>Select Photos</span>
          </label>

          <div class="field-grid compact">
            <label class="field">
              <span>Group Threshold</span>
              <input id="threshold" type="number" min="0" max="1" step="0.01" value="0.72">
            </label>
            <label class="field">
              <span>Preview Side</span>
              <input id="thumbSide" type="number" min="32" max="160" step="16" value="64">
            </label>
            <label class="field">
              <span>Output Max Side</span>
              <input id="maxSide" type="number" min="320" max="3840" step="160" value="1600">
            </label>
            <label class="field">
              <span>Image Format</span>
              <select id="imageFormat">
                <option value="image/jpeg">JPEG</option>
                <option value="image/png">PNG</option>
              </select>
            </label>
            <label class="field">
              <span>Image Quality</span>
              <input id="imageQuality" type="number" min="1" max="100" step="1" value="95">
            </label>
            <label class="field">
              <span>FPS</span>
              <input id="fps" type="number" min="1" max="60" step="1" value="24">
            </label>
            <label class="field">
              <span>Video Format</span>
              <select id="videoFormat">
                <option value="video/webm">WebM</option>
                <option value="video/mp4">MP4</option>
              </select>
            </label>
            <label class="field">
              <span>Video Quality Mbps</span>
              <input id="videoQuality" type="number" min="0.5" max="50" step="0.5" value="8">
            </label>
          </div>

          <div class="action-row">
            <button class="ghost" id="analyzeButton" type="button">Analyze</button>
            <button class="ghost" id="trailButton" type="button">Trail Image</button>
            <button class="primary" id="timelapseButton" type="button">Timelapse Video</button>
          </div>
        </section>

        <section class="monitor-panel" aria-label="Output preview">
          <div class="meter-row">
            <div>
              <p class="eyebrow">Selected Group</p>
              <h2 id="groupTitle">No Photos</h2>
            </div>
            <a class="download-link" id="downloadLink" hidden>Download</a>
          </div>
          <canvas id="previewCanvas" class="preview-canvas"></canvas>
          <pre id="logOutput" class="log-output">Awaiting input.</pre>
        </section>
      </section>

      <section class="editor-panel" aria-label="Manual group editor">
        <div class="editor-head">
          <div>
            <p class="eyebrow">Manual Review</p>
            <h2 id="editorTitle">Photo Editor</h2>
          </div>
          <div class="editor-head-actions">
            <button class="ghost" id="undoButton" type="button">Undo</button>
            <div class="photo-counter" id="photoCounter">0 / 0</div>
          </div>
        </div>
        <div class="editor-body">
          <figure class="photo-stage">
            <img id="photoPreview" alt="">
            <figcaption id="photoName">Select photos.</figcaption>
          </figure>
          <div class="editor-controls">
            <div class="nav-row">
              <button class="ghost" id="previousPhotoButton" type="button">Prev</button>
              <button class="ghost" id="nextPhotoButton" type="button">Next</button>
            </div>
            <label class="field">
              <span>Group Name</span>
              <input id="groupNameInput" type="text" autocomplete="off" spellcheck="false">
            </label>
            <div class="action-row tight split-row">
              <button class="ghost" id="renameGroupButton" type="button">Rename</button>
              <button class="ghost" id="addGroupButton" type="button">Add Group</button>
            </div>
            <label class="field">
              <span>Move To</span>
              <select id="targetGroup"></select>
            </label>
            <div class="action-row tight split-row">
              <button class="ghost" id="movePhotoButton" type="button">Move Photo</button>
              <button class="ghost danger" id="removePhotoButton" type="button">Remove</button>
            </div>
          </div>
        </div>
        <div class="review-window" aria-label="Selected group photos">
          <div class="review-window-head">
            <p class="eyebrow">Group Photos</p>
            <span id="filmstripCount">0 photo(s)</span>
          </div>
          <div class="photo-strip" id="photoStrip"></div>
        </div>
      </section>

      <section class="groups-panel" id="groupsPanel" aria-label="Detected groups"></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
