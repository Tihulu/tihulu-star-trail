name: release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "linux/**"
      - "macos/**"
      - "release/**"
      - "src/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install ".[release]"

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Build DMG
        run: ./macos/build-dmg.sh

      - name: Smoke-test packaged app
        run: |
          set -eu
          dmg=$(find release-dist -name '*.dmg' -print -quit)
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          TIHULU_DESKTOP_CHECK=1 "$mount_dir/Tihulu Star Trail.app/Contents/MacOS/Tihulu Star Trail"

      - name: Verify packaged FFmpeg video export dependency
        run: |
          set -eu
          dmg=$(find release-dist -name '*.dmg' -print -quit)
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          TIHULU_FFMPEG_CHECK=1 TIHULU_REQUIRE_BUNDLED_FFMPEG=1 \
            "$mount_dir/Tihulu Star Trail.app/Contents/MacOS/Tihulu Star Trail"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-dist/*.dmg
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2
          python -m pip install ".[release]"

      - name: Build AppImage
        run: ./linux/build-appimage.sh

      - name: Smoke-test AppImage
        run: |
          appimage=$(find release-dist -name '*.AppImage' -print -quit)
          TIHULU_DESKTOP_CHECK=1 "$appimage"

      - name: Verify packaged FFmpeg video export dependency
        run: |
          appimage=$(find release-dist -name '*.AppImage' -print -quit)
          TIHULU_FFMPEG_CHECK=1 TIHULU_REQUIRE_BUNDLED_FFMPEG=1 "$appimage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: release-dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-dmg
      - linux-appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Tihulu Star Trail ${GITHUB_REF_NAME}"
