name: release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "release/**"
      - "src/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  macos-dmg:
    name: macOS DMG (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        timeout-minutes: 8
        run: python -m pip install ".[release]"

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Build DMG
        run: ./macos/build-dmg.sh

      - name: Smoke-test packaged app
        run: |
          set -eu
          dmg=$(find release-dist -name '*.dmg' -print -quit)
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          TIHULU_DESKTOP_CHECK=1 "$mount_dir/Tihulu Star Trail.app/Contents/MacOS/Tihulu Star Trail"

      - name: Verify packaged FFmpeg video export dependency
        run: |
          set -eu
          dmg=$(find release-dist -name '*.dmg' -print -quit)
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          TIHULU_FFMPEG_CHECK=1 TIHULU_REQUIRE_BUNDLED_FFMPEG=1 \
            "$mount_dir/Tihulu Star Trail.app/Contents/MacOS/Tihulu Star Trail"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: release-dist/*.dmg
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux system dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends python3-tk libfuse2

      - name: Install Python build dependencies
        timeout-minutes: 8
        run: python -m pip install ".[release]"

      - name: Build AppImage
        run: ./linux/build-appimage.sh

      - name: Smoke-test AppImage
        run: |
          appimage=$(find release-dist -name '*.AppImage' -print -quit)
          TIHULU_DESKTOP_CHECK=1 "$appimage"

      - name: Verify packaged FFmpeg video export dependency
        run: |
          appimage=$(find release-dist -name '*.AppImage' -print -quit)
          TIHULU_FFMPEG_CHECK=1 TIHULU_REQUIRE_BUNDLED_FFMPEG=1 "$appimage"

      - name: Smoke-test FUSE-free launcher
        run: |
          launcher=$(find release-dist -name '*-no-fuse.sh' -print -quit)
          TIHULU_DESKTOP_CHECK=1 "$launcher"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: |
            release-dist/*.AppImage
            release-dist/*-no-fuse.sh
          if-no-files-found: error

  windows-exe:
    name: Windows EXE (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        timeout-minutes: 8
        run: python -m pip install ".[release]"

      - name: Build Windows executable
        shell: powershell
        run: .\windows\build.ps1

      - name: Smoke-test packaged app
        shell: powershell
        run: |
          $exe = (Get-ChildItem release-dist -Filter "*windows-x86_64.exe" | Select-Object -First 1).FullName
          if (-not $exe) { throw "Windows release executable was not found." }
          $env:TIHULU_DESKTOP_CHECK = "1"
          $process = Start-Process -FilePath $exe -Wait -PassThru
          Remove-Item Env:TIHULU_DESKTOP_CHECK -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Desktop dependency smoke test failed with exit code $($process.ExitCode)." }

      - name: Verify packaged FFmpeg video export dependency
        shell: powershell
        run: |
          $exe = (Get-ChildItem release-dist -Filter "*windows-x86_64.exe" | Select-Object -First 1).FullName
          if (-not $exe) { throw "Windows release executable was not found." }
          $env:TIHULU_FFMPEG_CHECK = "1"
          $env:TIHULU_REQUIRE_BUNDLED_FFMPEG = "1"
          $process = Start-Process -FilePath $exe -Wait -PassThru
          Remove-Item Env:TIHULU_FFMPEG_CHECK -ErrorAction SilentlyContinue
          Remove-Item Env:TIHULU_REQUIRE_BUNDLED_FFMPEG -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Bundled FFmpeg smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: release-dist/*windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - macos-dmg
      - linux-appimage
      - windows-exe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -n 1)
            if [[ -z "${version}" ]]; then
              echo "Could not determine version from pyproject.toml" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --title "Tihulu Star Trail ${RELEASE_TAG}"
