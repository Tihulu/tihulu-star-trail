name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Debian image packages
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            python3 python3-venv python3-pip python3-opencv python3-numpy \
            python3-pillow python3-pytest python3-tk tk-dev xdg-utils

      - name: Install project
        timeout-minutes: 8
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install rawpy
          python -m pip install -e . --no-deps

      - name: Check browser JavaScript
        run: |
          node --check src/tihulu_star_trail/web/app.js
          node --check docs/app.js
          node --check docs/photo-order.js
          node tests/web-photo-order.test.js

      - name: Check desktop dependencies
        run: |
          . .venv/bin/activate
          tihulu desktop --check

      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest

  windows-pytest:
    name: Windows pytest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and tests
        timeout-minutes: 8
        run: python -m pip install -e ".[dev,video]"

      - name: Check desktop dependencies
        run: tihulu desktop --check

      - name: Run tests
        run: python -m pytest
