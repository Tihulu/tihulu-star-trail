name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Debian image packages
        run: |
          sudo apt update
          sudo apt install -y python3 python3-venv python3-pip python3-opencv python3-numpy python3-pillow python3-pytest

      - name: Install project
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install -e . --no-deps

      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest
